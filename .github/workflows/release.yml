name: Release

# Pushing a tag such as v0.2.0 tests, builds every target and publishes the
# binaries as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The binaries report the version written in main.go, and so does a
      # copy installed with `go install`. Refuse a tag that says otherwise.
      - name: Tag matches the version in the source
        run: |
          want="secnote ${GITHUB_REF_NAME#v}"
          got=$(go run ./cmd/secnote -version)
          if [ "$got" != "$want" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と cmd/secnote/main.go のバージョン ($got) が一致しません"
            exit 1
          fi
      - run: go test ./...
      - run: ./build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
